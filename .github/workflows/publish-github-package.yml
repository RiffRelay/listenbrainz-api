name: Publish to GitHub Packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Publish scoped package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up npm registry credentials
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@listenbrainzbot"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, typecheck, and test
        run: |
          bun run lint
          bun run typecheck
          bun test

      - name: Build package
        run: bun run build

      - name: Verify release tag matches package version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            if (process.env.GITHUB_REF_NAME !== `v${version}`) {
              throw new Error(`Release tag must be v${version}`);
            }
          '

      - name: Apply GitHub Packages scope
        run: npm pkg set name=@listenbrainzbot/listenbrainz-api

      - name: Publish package
        run: npm publish --registry=https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
