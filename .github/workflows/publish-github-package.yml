name: Publish to GitHub Packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up npm registry credentials
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@riffrelay"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, typecheck, and test
        run: |
          bun run lint
          bun run typecheck
          bun test

      - name: Build package
        run: bun run build

  publish:
    name: Publish scoped package
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up npm registry credentials
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@riffrelay"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("package.json", "utf8"));
            if (process.env.GITHUB_REF_NAME !== `v${version}`) {
              throw new Error(`Release tag must be v${version}`);
            }
          '

      - name: Apply GitHub Packages scope
        run: npm pkg set name=@riffrelay/listenbrainz-api

      - name: Publish package
        run: |
          version="$(node -p "require('./package.json').version")"
          package="@riffrelay/listenbrainz-api"
          if npm view "${package}@${version}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "${package}@${version} already exists; bump package.json to publish a new version."
          else
            npm publish --registry=https://npm.pkg.github.com
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
